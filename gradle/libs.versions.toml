[versions]
kotlin = "2.4.0"
kotlinx-serialization = "1.11.0"
compose-multiplatform = "1.11.1"
compose-material-icons = "1.7.3"
compose-material3 = "1.9.0"
compose-material3-adaptive = "1.2.0"
compose-material3-adaptive-suite = "1.9.0"
navigation-compose = "2.9.2"
docker = "9.4.0"

kotlinx-datetime = "0.7.1"
kotlin-logging = "8.0.01"
clikt = "5.1.0"
ktor = "3.5.1"
koin = "4.2.2"
exposed = "1.2.0"
postgresql = "42.7.11"
kotlinx-coroutines = "1.10.2"
kotlin-codepoints = "1.0.1"
onnxruntime = "1.26.0"
slf4j = "2.0.17"
logback = "1.5.32"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
docker = { id = "com.bmuschko.docker-remote-api", version.ref = "docker" }

[libraries]
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging", version.ref = "kotlin-logging" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-codepoints = { group = "me.zolotov.kodepoint", name = "kodepoint", version.ref = "kotlin-codepoints" }
onnxruntime = { group = "com.microsoft.onnxruntime", name = "onnxruntime_gpu", version.ref = "onnxruntime" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback-core = { group = "ch.qos.logback", name = "logback-core", version.ref = "logback" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-multiplatform" }
compose-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose-multiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose-multiplatform" }
compose-material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "compose-material-icons" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose-multiplatform" }
compose-components-ui-tooling-preview = { group = "org.jetbrains.compose.components", name = "components-ui-tooling-preview", version.ref = "compose-multiplatform" }
navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }
compose-material3-adaptive = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive", version.ref = "compose-material3-adaptive" }
compose-material3-adaptive-layout = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-layout", version.ref = "compose-material3-adaptive" }
compose-material3-adaptive-navigation = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "compose-material3-adaptive" }
compose-material3-adaptive-navigation-suite = { group = "org.jetbrains.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "compose-material3-adaptive-suite" }

clikt = { group = "com.github.ajalt.clikt", name = "clikt", version.ref = "clikt" }
koin-ktor = { group = "io.insert-koin", name = "koin-ktor", version.ref = "koin" }

ktor-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-resources = { group = "io.ktor", name = "ktor-resources", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-resources = { group = "io.ktor", name = "ktor-client-resources", version.ref = "ktor" }
ktor-client-auth = { group = "io.ktor", name = "ktor-client-auth", version.ref = "ktor" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-resources = { group = "io.ktor", name = "ktor-server-resources", version.ref = "ktor" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth", version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-auto-head-response = { group = "io.ktor", name = "ktor-server-auto-head-response", version.ref = "ktor" }

exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-dao = { group = "org.jetbrains.exposed", name = "exposed-dao", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { group = "org.jetbrains.exposed", name = "exposed-kotlin-datetime", version.ref = "exposed" }
exposed-json = { group = "org.jetbrains.exposed", name = "exposed-json", version.ref = "exposed" }
exposed-migration-core = { group = "org.jetbrains.exposed", name = "exposed-migration-core", version.ref = "exposed" }
exposed-migration-jdbc = { group = "org.jetbrains.exposed", name = "exposed-migration-jdbc", version.ref = "exposed" }
jdbc-postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }

[bundles]
kotlin-test = [
    "kotlin-test",
    "kotlinx-coroutines-test",
]
kotlinx-serialization = [
    "kotlinx-serialization-json",
]
ktor-client = [
    "ktor-json",
    "ktor-client-core",
    "ktor-client-cio",
    "ktor-client-resources",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-client-auth",
]
ktor-server = [
    "ktor-json",
    "ktor-server-core",
    "ktor-server-cio",
    "ktor-server-resources",
    "ktor-server-content-negotiation",
    "ktor-server-auto-head-response",
    "ktor-server-auth",
]
exposed = [
    "exposed-core",
    "exposed-json",
    "exposed-kotlin-datetime",
    "exposed-migration-core",
]
exposed-jdbc = [
    "exposed-jdbc",
    "exposed-migration-jdbc",
    "exposed-dao",
    "jdbc-postgresql",
]
slf4j = [
    "slf4j-api",
    "logback-core",
    "logback-classic",
]
material3-adaptive = [
    "compose-material3-adaptive",
    "compose-material3-adaptive-layout",
    "compose-material3-adaptive-navigation",
    "compose-material3-adaptive-navigation-suite",
]
